/* ---------------- SEARCH PALETTE ---------------- */
const Palette = (function () {
  let el, input, list, sel = 0, res = [];
  function build() {
    el = h("div", { id: "palette", hidden: true, role: "dialog", "aria-label": "Search the atlas" });
    el.innerHTML = `<div class="box glass"><input id="pq" type="search" placeholder="Search regions, genes, proteins, receptors, pathways, functions…" autocomplete="off" aria-label="Search"/>
      <ul id="pres" role="listbox"></ul><div class="hint"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span><span>Try “dopamine receptor”, “memory”, “chromosome 11”</span></div></div>`;
    $("#app").append(el);
    input = $("#pq"); list = $("#pres");
    el.addEventListener("click", (e) => { if (e.target === el) close(); });
    input.addEventListener("input", run);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { sel = Math.min(res.length - 1, sel + 1); paint(); e.preventDefault(); }
      if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); paint(); e.preventDefault(); }
      if (e.key === "Enter" && res[sel]) choose(res[sel].id);
      if (e.key === "Escape") close();
    });
  }
  function run() { res = KG.search(input.value); sel = 0; paint(); }
  function paint() {
    if (!input.value.trim()) {
      const sug = ["hippocampus", "p_d1", "g_comt", "pw_ltp", "f_wm", "o_nucleus", "k_dna", "c_purk"].map(KG.get);
      res = sug;
    }
    if (!res.length) { list.innerHTML = `<li class="empty">Nothing matches “${esc(input.value)}”. Try a broader term such as “receptor” or “memory”.</li>`; return; }
    list.innerHTML = res.map((e, i) => `<li role="option" data-id="${e.id}" aria-selected="${i === sel}"><b>${esc(e.name)}</b><span class="ty" style="color:var(--t-${e.type === "chromosome" ? "gene" : e.type})">${esc(KG.TYPE_LABEL[e.type])}</span><span class="pth">${esc(KG.pathPreview(e.id) || e.short || "")}</span></li>`).join("");
    $$("li[data-id]", list).forEach((li) => (li.onclick = () => choose(li.dataset.id)));
    const s = list.querySelector('[aria-selected="true"]'); s && s.scrollIntoView({ block: "nearest" });
  }
  function choose(id) { close(); App.open(id, { from: "search" }); }
  function open() { $("#settings").hidden = true; el.hidden = false; input.value = ""; run(); paint(); setTimeout(() => input.focus(), 10); }
  function close() { el.hidden = true; }
  return { build, open, close, get isOpen() { return !el.hidden; } };
})();

/* ---------------- SETTINGS ---------------- */
function buildSettings() {
  const el = h("aside", { id: "settings", class: "glass", hidden: true, "aria-label": "Settings" });
  $("#app").append(el);
  const PRE = [["lab", "Laboratory", "#05080d", "#7cc4ff"], ["minimal", "Minimal dark", "#0a0a0b", "#e8e8e8"], ["futuristic", "Futuristic", "#03030c", "#4ff0ff"], ["medical", "Medical", "#e9eef2", "#0a6fc2"], ["academic", "Academic", "#f3f4f6", "#2b3a8f"], ["contrast", "High contrast", "#000", "#ffe600"]];
  const sel = (k, opts) => `<select id="s_${k}">${opts.map(([v, l]) => `<option value="${v}" ${String(Settings[k]) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const rng = (k, min, max, step) => `<input type="range" id="s_${k}" min="${min}" max="${max}" step="${step}" value="${Settings[k]}">`;
  const chk = (k) => `<input type="checkbox" id="s_${k}" ${Settings[k] ? "checked" : ""}>`;
  const row = (label, ctl) => `<label class="srow"><span>${label}</span>${ctl}</label>`;
  function render() {
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2>Settings</h2><button class="dclose" style="position:static" id="sClose" aria-label="Close settings">${ICON.close}</button></div>
      <fieldset><legend>Appearance</legend><div class="presets">${PRE.map(([k, l, bg, ac]) => `<button data-p="${k}" aria-pressed="${Settings.preset === k}"><i style="background:linear-gradient(135deg,${bg} 55%,${ac} 55%)"></i>${l}</button>`).join("")}</div>
        ${row("Background", sel("bg", [["grid", "Lab grid"], ["void", "Plain void"]]))}
        ${row("Interface density", sel("density", [["compact", "Compact"], ["normal", "Normal"], ["comfortable", "Comfortable"]]))}
        ${row("Region colors", sel("regionColors", [["atlas", "Atlas (color-coded)"], ["anatomical", "Anatomical tissue"]]))}
        ${row("Labels", sel("labels", [["auto", "Selected & hovered"], ["all", "All visible"], ["off", "Selected only"]]))}
        ${row("Highlight intensity", rng("highlight", 0.3, 2, 0.1))}
        ${row("Visual effects (particles)", chk("effects"))}</fieldset>
      <fieldset><legend>Learning</legend>
        ${row("Information depth", sel("detail", LEVELS.map((l) => [l, l[0].toUpperCase() + l.slice(1)])))}
        ${row("Animations", chk("animations"))}
        ${row("Animation speed", sel("animSpeed", [[0.5, "0.5×"], [0.75, "0.75×"], [1, "1×"], [1.25, "1.25×"], [1.5, "1.5×"], [2, "2×"]]))}</fieldset>
      <fieldset><legend>Sound</legend>
        ${row("Narration" + (Voice.ok ? "" : " (not supported here)"), chk("narration"))}
        ${row("Voice rate", rng("voiceRate", 0.7, 1.6, 0.05))}
        ${row("Background sound", chk("ambient"))}
        ${row("Volume", rng("volume", 0, 1, 0.05))}
        <p style="font-size:12px;color:var(--muted);margin:6px 0 0">Everything narrated is also shown as text, so sound is never required.</p></fieldset>
      <fieldset><legend>Camera</legend>
        ${row("Camera sensitivity", rng("camSens", 0.3, 2.5, 0.1))}
        ${row("Auto-rotate when idle", chk("autorotate"))}</fieldset>
      <fieldset><legend>Progress</legend><button class="btn" id="sReset">Clear study progress and score</button></fieldset>`;
    $("#sClose").onclick = () => (el.hidden = true);
    $$("[data-p]", el).forEach((b) => (b.onclick = () => { setSetting("preset", b.dataset.p); render(); }));
    ["bg", "density", "regionColors", "labels", "detail", "animSpeed"].forEach((k) => ($("#s_" + k).onchange = (e) => setSetting(k, k === "animSpeed" ? +e.target.value : e.target.value)));
    ["highlight", "voiceRate", "volume", "camSens"].forEach((k) => ($("#s_" + k).oninput = (e) => setSetting(k, +e.target.value)));
    ["effects", "animations", "narration", "ambient", "autorotate"].forEach((k) => ($("#s_" + k).onchange = (e) => setSetting(k, e.target.checked)));
    $("#sReset").onclick = () => { State.journey = []; State.study = {}; State.quiz = { right: 0, total: 0 }; State.drillDone = {}; saveState(); renderJourney(); Study.renderPath(); toast("Progress cleared"); };
  }
  render();
  Bus.on("settings", (k) => { if (k === "ambient" || k === "volume") Ambient.set(Settings.ambient); if (k === "detail" && App.current) Dossier.render(KG.get(App.current)); if (["detail", "animSpeed", "narration"].includes(k) && !el.hidden) { const s = $("#s_" + k); if (s) s.type === "checkbox" ? (s.checked = Settings[k]) : (s.value = Settings[k]); } });
  return { toggle() { el.hidden = !el.hidden; if (!el.hidden) { render(); Palette.close(); } } };
}

/* ---------------- TOOLBARS ---------------- */
function buildBrainTools() {
  const t = h("div", { id: "brainTools", class: "toolbar glass", role: "toolbar", "aria-label": "Brain view controls" });
  const btn = (id, icon, label, fn, pressed) => { const b = h("button", { id, title: label, "aria-pressed": pressed == null ? null : String(pressed), html: ICON[icon] + `<span>${label}</span>` }); b.onclick = fn; return b; };
  t.append(
    btn("tReset", "reset", "Reset", () => { Brain.view("default"); App.close(); }),
    h("span", { class: "div" }),
    ...[["left", "Left"], ["right", "Right"], ["top", "Top"], ["front", "Front"], ["back", "Back"]].map(([v, l]) => { const b = h("button", { title: l + " view" }, l); b.onclick = () => Brain.view(v); return b; }),
    h("span", { class: "div" }),
    btn("tXray", "xray", "X-ray", () => Brain.setXray(!Brain.xray), Brain.xray),
    btn("tIso", "isolate", "Isolate", () => Brain.setIsolate(!Brain.isolate), Brain.isolate),
    btn("tLayers", "layers", "Structures", (e) => layers(e)),
    btn("tRot", "orbit", "Rotate", () => setSetting("autorotate", !Settings.autorotate), Settings.autorotate)
  );
  $("#app").append(t);
  const sync = () => { $("#tXray").setAttribute("aria-pressed", Brain.xray); $("#tIso").setAttribute("aria-pressed", Brain.isolate); $("#tRot").setAttribute("aria-pressed", Settings.autorotate); };
  Bus.on("brain:tools", sync); Bus.on("settings", sync);
  function layers(ev) {
    let p = $("#layersPop");
    if (p) { p.remove(); return; }
    p = h("div", { id: "layersPop", class: "pop glass" });
    p.innerHTML = `<h4>Show / hide structures</h4>` + Brain.ALL.map((id) => `<label><input type="checkbox" data-id="${id}" ${Brain.hidden.has(id) ? "" : "checked"}><span class="tdot" style="background:${KG.get(id).color}"></span>${esc(KG.get(id).name)}</label>`).join("");
    $("#app").append(p);
    const r = $("#tLayers").getBoundingClientRect();
    p.style.left = clamp(r.left, 8, window.innerWidth - 250) + "px"; p.style.bottom = window.innerHeight - r.top + 8 + "px";
    $$("input", p).forEach((c) => (c.onchange = () => Brain.toggleHidden(c.dataset.id, c.checked)));
    setTimeout(() => document.addEventListener("pointerdown", function off(e) { if (!p.contains(e.target) && e.target.closest("#tLayers") == null) { p.remove(); document.removeEventListener("pointerdown", off); } }), 0);
  }
}
function buildCellSide() {
  const L = h("div", { id: "ladder", class: "glass" });
  const FLOW = [["k_dna", "DNA", "packaged into"], ["k_chromosome", "Chromosomes", "together form the"], ["k_genome", "Genome", "specific regions contain"], ["k_gene", "Genes", "whose variants form"], ["k_genotype", "Genotypes", "genes are read through"], ["k_expression", "Gene expression", "DNA is transcribed into"], ["k_rna", "RNA", "processed into"], ["k_mrna", "mRNA", "translated by"], ["o_ribo", "Ribosomes", "producing"], ["k_protein", "Proteins", "which perform"], ["k_function", "Cellular functions", null]];
  L.innerHTML = `<div class="phead"><h4>Zoom level</h4><button class="pmin" data-min="ladder" aria-label="Minimize zoom panel" title="Minimize">${ICON.min}</button></div><div class="ladder-line" id="ladderRungs"></div>
    <div id="flow"><h4 style="margin-top:14px">Information flow</h4>${FLOW.map(([id, n, verb]) => `<button class="flowstep" data-flow="${id}">${n}</button>${verb ? `<div class="flowverb">${verb}</div>` : ""}`).join("")}</div>`;
  $("#app").append(L);
  $$("[data-flow]", L).forEach((b) => (b.onclick = () => { $$(".flowstep.on").forEach((x) => x.classList.remove("on")); b.classList.add("on"); App.open(b.dataset.flow); }));
  const sb = h("div", { id: "scalebar", class: "scalebar glass", hidden: true, "aria-label": "Scale" }, h("i"), h("span", null, ""));
  $("#app").append(sb);
  $("#app").append(h("div", { id: "seqStrip", class: "glass", hidden: true }));
}

/* ---------------- BOOT ---------------- */
function boot() {
  applySettings();
  const rail = $("#rail");
  [["brain", "Brain", "brain"], ["cell", "Genome", "cell"], ["sim", "Molecular", "dna"], ["map", "Map", "map"], ["study", "Study", "study"]].forEach(([v, l, i]) => {
    const b = h("button", { "data-view": v, "aria-label": l, html: ICON[i] + `<span>${l}</span>` }); b.onclick = () => App.go(v); rail.append(b);
  });
  rail.append(h("hr"));
  const sb = h("button", { "aria-label": "Search", html: ICON.search + "<span>Search</span>" }); sb.onclick = () => Palette.open(); rail.append(sb);
  const st = h("button", { "aria-label": "Settings", html: ICON.settings + "<span>Settings</span>" }); rail.append(st);
  $("#searchBtn").innerHTML = ICON.search.replace("<svg", '<svg width="15" height="15"') + "<span>Search</span><kbd>/</kbd>";
  $("#searchBtn").onclick = () => Palette.open();

  buildBrainTools(); buildCellSide();
  Dossier.build(); Palette.build(); Mech.build();
  const S = buildSettings(); st.onclick = () => S.toggle();
  Sim.build(); MapView.build(); Study.build();
  Panels.init();

  // any element with data-open navigates to that entity
  document.addEventListener("click", (e) => { const t = e.target.closest("[data-open]"); if (t) { e.preventDefault(); App.open(t.dataset.open); } });
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); Palette.open(); }
    else if (e.key === "Escape") {
      if (Palette.isOpen) Palette.close();
      else if (!$("#settings").hidden) $("#settings").hidden = true;
      else if (Mech.open_) Mech.close();
      else if (App.current) App.close();
    } else if (!typing && App.view === "brain" && e.key.toLowerCase() === "r") Brain.view("default");
  });
  renderJourney();
  const ok = GFX.init();
  setTimeout(() => {
    if (ok) { Brain.init(); Cell.init(); }
    const hv = (location.hash || "").slice(1);
    App.go(["brain", "cell", "sim", "map", "study"].includes(hv) ? hv : State.view || "brain");
    if (State.entity && KG.get(State.entity)) App.open(State.entity, { nojourney: true, stay: true, fly: false, quiet: true });
    $("#loading").classList.add("done");
    if (Settings.ambient) document.addEventListener("pointerdown", () => Ambient.set(true), { once: true });
  }, 40);
}
document.addEventListener("DOMContentLoaded", boot);

</script>
