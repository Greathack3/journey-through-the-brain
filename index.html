<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brain–Genome Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
/* Layout: a full-bleed 3D void with floating instrument panels — rail left, dossier right, tools bottom. */
:root {
  --void: #05080d; --void-2: #0a1019; --grid: rgba(120,160,210,.06);
  --panel: rgba(11,17,26,.84); --panel-solid: #0d141e; --panel-2: rgba(22,32,46,.7);
  --line: rgba(140,170,210,.15); --line-strong: rgba(140,170,210,.32);
  --fg: #e4ebf3; --muted: #8d9cb0; --faint: #5d6c80;
  --accent: #7cc4ff; --accent-ink: #04121f; --accent-soft: rgba(124,196,255,.14);
  --good: #6fdca4; --bad: #ff8a80;
  --t-gene: #6ea8ff; --t-protein: #5ad6a0; --t-transmitter: #ffc857; --t-pathway: #c39bff; --t-cell: #ff9479;
  --t-region: #ff7eb6; --t-function: #f1e2b0; --t-organelle: #8fd3e6; --t-concept: #a9b8c9;
  --tx-glu: #ffb14a; --tx-gaba: #7aa2ff; --tx-da: #ff6fcf; --tx-pep: #9ff0c8;
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pad: 14px; --gap: 10px; --radius: 12px; --blur: 14px;
  color-scheme: dark;
}
:root[data-preset="minimal"] { --void:#0a0a0b; --void-2:#121214; --panel:rgba(18,18,20,.88); --panel-solid:#141416; --panel-2:rgba(30,30,34,.8); --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.24); --accent:#e8e8e8; --accent-ink:#0a0a0b; --accent-soft:rgba(255,255,255,.1); --grid:rgba(255,255,255,.035); }
:root[data-preset="futuristic"] { --void:#03030c; --void-2:#0a0820; --panel:rgba(10,8,30,.78); --panel-solid:#0d0b26; --panel-2:rgba(30,20,70,.55); --line:rgba(120,240,255,.2); --line-strong:rgba(120,240,255,.45); --accent:#4ff0ff; --accent-ink:#020214; --accent-soft:rgba(79,240,255,.14); --muted:#9aa4d6; --grid:rgba(79,240,255,.07); }
:root[data-preset="medical"] { --void:#e9eef2; --void-2:#dfe6ec; --panel:rgba(255,255,255,.9); --panel-solid:#ffffff; --panel-2:rgba(232,239,245,.9); --line:rgba(20,50,80,.14); --line-strong:rgba(20,50,80,.3); --fg:#13222f; --muted:#506273; --faint:#8296a8; --accent:#0a6fc2; --accent-ink:#ffffff; --accent-soft:rgba(10,111,194,.1); --grid:rgba(20,60,100,.06);
  --t-gene:#2a63d4; --t-protein:#13985f; --t-transmitter:#b07a00; --t-pathway:#7a4bd1; --t-cell:#d1532f; --t-region:#c2387a; --t-function:#7a6420; --t-organelle:#1d8299; --t-concept:#5a6b7e; --good:#13985f; --bad:#c9372c; color-scheme: light; }
:root[data-preset="academic"] { --void:#f3f4f6; --void-2:#e8eaee; --panel:rgba(252,252,253,.94); --panel-solid:#fcfcfd; --panel-2:rgba(236,238,243,.9); --line:rgba(25,30,60,.14); --line-strong:rgba(25,30,60,.32); --fg:#1a1d2e; --muted:#545a74; --faint:#8a90a8; --accent:#2b3a8f; --accent-ink:#ffffff; --accent-soft:rgba(43,58,143,.09); --grid:rgba(25,30,60,.05);
  --t-gene:#2b4fc4; --t-protein:#16805a; --t-transmitter:#9a6b00; --t-pathway:#6b3fc0; --t-cell:#c0492b; --t-region:#b0306e; --t-function:#6e5a1a; --t-organelle:#19798f; --t-concept:#555f72; --good:#16805a; --bad:#b8342a; color-scheme: light; }
:root[data-preset="contrast"] { --void:#000; --void-2:#000; --panel:#000; --panel-solid:#000; --panel-2:#111; --line:#fff; --line-strong:#fff; --fg:#fff; --muted:#e6e6e6; --faint:#bdbdbd; --accent:#ffe600; --accent-ink:#000; --accent-soft:rgba(255,230,0,.2); --grid:transparent; --blur:0px;
  --t-gene:#7fb2ff; --t-protein:#4dff9e; --t-transmitter:#ffe600; --t-pathway:#d9a6ff; --t-cell:#ffa07a; --t-region:#ff8fcf; --t-function:#fff; --t-organelle:#7ff0ff; --t-concept:#fff; }
:root[data-density="compact"] { --pad: 10px; --gap: 7px; }
:root[data-density="comfortable"] { --pad: 18px; --gap: 13px; }

[hidden] { display: none !important; }
.minimized { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--fg); font: 400 14px/1.5 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#bggrid { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%); }
:root[data-bg="void"] #bggrid { display: none; }

/* ---------- floating surfaces ---------- */
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(var(--blur)) saturate(1.2); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.2); box-shadow: 0 10px 40px rgba(0,0,0,.28); }

/* ---------- top bar ---------- */
#topbar { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; align-items: center; gap: 14px; pointer-events: none; z-index: 20; }
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font: 400 22px/1 var(--f-display); letter-spacing: .01em; }
.brand small { font: 500 10px/1 var(--f-mono); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
#tray { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
#tray::-webkit-scrollbar { display: none; }
.tpill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px; flex: none; max-width: 260px; }
.tpill button { border: 0; background: transparent; color: var(--fg); border-radius: 999px; }
.tp-open { display: inline-flex; align-items: baseline; gap: 7px; padding: 5px 6px 5px 12px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tp-open:hover { color: var(--accent); }
.tp-kind { font: 500 9.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tp-x { display: grid; place-items: center; width: 24px; height: 24px; color: var(--muted) !important; }
.tp-x:hover { background: var(--accent-soft) !important; color: var(--fg) !important; }
.tp-x svg { width: 13px; height: 13px; }
.pbtns { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
#dossier .pbtns .dclose { position: static; }
.pmin { border: 0; background: transparent; color: var(--muted); padding: 5px; border-radius: 6px; display: inline-grid; place-items: center; }
.pmin:hover { color: var(--fg); background: var(--accent-soft); }
.pmin svg, .pbtns svg { width: 16px; height: 16px; }
.phead { display: flex; justify-content: space-between; align-items: center; margin: -4px -4px 4px 0; }
.phead h4 { margin: 0 !important; }
#journey { display: none; flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
#journey::-webkit-scrollbar { display: none; }
#journey .jlabel { font: 500 10px var(--f-mono); color: var(--faint); letter-spacing: .12em; text-transform: uppercase; margin-right: 4px; white-space: nowrap; }
#journey .sep { color: var(--faint); font-size: 11px; }
.iconbtn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); white-space: nowrap; backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
.iconbtn:hover { border-color: var(--line-strong); }
kbd { font: 500 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); }

/* ---------- chips (entity references) ---------- */
.chip { --c: var(--t-concept); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--fg); font-size: 12.5px; line-height: 1.6; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.chip:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
.chip.current { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.chip[data-type="gene"] { --c: var(--t-gene); font-family: var(--f-mono); font-size: 12px; font-style: italic; }
.chip[data-type="protein"] { --c: var(--t-protein); } .chip[data-type="transmitter"] { --c: var(--t-transmitter); }
.chip[data-type="pathway"] { --c: var(--t-pathway); } .chip[data-type="cell"] { --c: var(--t-cell); }
.chip[data-type="region"] { --c: var(--t-region); } .chip[data-type="function"] { --c: var(--t-function); }
.chip[data-type="organelle"] { --c: var(--t-organelle); } .chip[data-type="concept"] { --c: var(--t-concept); }
.tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

/* ---------- rail ---------- */
#rail { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 6px; }
#rail button { width: 64px; padding: 9px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 500 10.5px/1.1 var(--f-body); letter-spacing: .02em; }
#rail button svg { width: 22px; height: 22px; }
#rail button:hover { color: var(--fg); background: var(--accent-soft); }
#rail button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
#rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* ---------- 3D labels ---------- */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.l3d { position: absolute; transform: translate(-50%, -100%); font: 500 11.5px var(--f-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; white-space: nowrap; transition: opacity .2s; }
.l3d::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 1px; height: 7px; background: var(--line-strong); }
.l3d.sel { border-color: var(--accent); color: var(--accent); }
.l3d.dim { opacity: .55; }
:root[data-labels="off"] #labels .l3d:not(.sel):not(.hov) { display: none; }
#hovertip { position: absolute; z-index: 30; pointer-events: none; padding: 6px 10px; font-size: 12.5px; max-width: 260px; }
#hovertip b { display: block; font-weight: 600; }
#hovertip span { color: var(--muted); font-size: 11.5px; }

/* ---------- bottom tool bars ---------- */
.toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 18; display: flex; align-items: center; gap: 2px; padding: 5px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button { border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.toolbar button:hover { color: var(--fg); background: var(--accent-soft); }
.toolbar button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.toolbar .div { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; flex: none; }
.toolbar svg { width: 16px; height: 16px; }
.pop { position: absolute; z-index: 40; padding: 10px; min-width: 230px; max-height: 60vh; overflow: auto; }
.pop h4 { margin: 2px 4px 8px; font: 500 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pop label { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.pop label:hover { background: var(--accent-soft); }

/* ---------- cell explorer side ladder ---------- */
#ladder { position: absolute; left: 104px; top: 84px; z-index: 15; width: 220px; padding: 12px; }
#ladder h4, .eyebrow { margin: 0 0 8px; font: 500 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rung { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 6px; border-radius: 8px; border: 0; background: transparent; color: var(--fg); }
.rung:hover { background: var(--accent-soft); }
.rung i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); justify-self: center; }
.rung[aria-current="step"] i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
.rung[aria-current="step"] { color: var(--accent); }
.rung small { font: 500 10.5px var(--f-mono); color: var(--muted); }
.ladder-line { margin-left: 12px; border-left: 1px dashed var(--line-strong); }
#ladder { max-height: calc(100% - 180px); overflow-y: auto; box-sizing: border-box; }
#flow .flowstep { padding: 5px 10px; }
.chip[data-type="chromosome"] { --c: var(--t-gene); }
.flowstep { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; color: var(--fg); }
.flowstep:hover { border-color: var(--accent); }
.flowstep.on { border-color: var(--accent); color: var(--accent); }
.flowverb { font: italic 400 13px/1.3 var(--f-display); color: var(--muted); padding: 4px 0 4px 14px; border-left: 1px solid var(--line-strong); margin-left: 12px; }
#seqStrip { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); z-index: 16; max-width: min(720px, calc(100% - 32px)); padding: 10px 12px; }
#seqStrip .seq { font: 500 12px/1.7 var(--f-mono); white-space: nowrap; overflow-x: auto; letter-spacing: .06em; padding-bottom: 4px; }
.b-A { color: #ff8f6b; } .b-T { color: #ffd66b; } .b-G { color: #6bd3ff; } .b-C { color: #9cf28a; } .b-U { color: #ffd66b; }
:root[data-preset="medical"] .b-T, :root[data-preset="academic"] .b-T, :root[data-preset="medical"] .b-U, :root[data-preset="academic"] .b-U { color: #a57a00; }
:root[data-preset="medical"] .b-C, :root[data-preset="academic"] .b-C { color: #2f8a1f; }
:root[data-preset="medical"] .b-G, :root[data-preset="academic"] .b-G { color: #0b78a8; }
:root[data-preset="medical"] .b-A, :root[data-preset="academic"] .b-A { color: #c6461f; }
.seg-intron { opacity: .55; text-decoration: underline dotted; }
.seg-promoter { opacity: .5; }

/* ---------- dossier ---------- */
#dossier { position: absolute; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(410px, 38vw); z-index: 25; display: flex; flex-direction: column; overflow: hidden; }
#dossier .dhead { padding: var(--pad) var(--pad) 10px; border-bottom: 1px solid var(--line); }
#dossier .dtype { display: flex; align-items: center; gap: 8px; font: 500 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#dossier .dtype { padding-right: 64px; }
#dossier h2 { margin: 6px 0 4px; font: 400 30px/1.05 var(--f-display); text-wrap: balance; }
#dossier h2.gene { font-family: var(--f-mono); font-style: italic; font-size: 26px; }
#dossier .short { margin: 0; color: var(--muted); font-size: 13.5px; }
#dossier .dclose { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 6px; }
#dossier .dclose:hover { color: var(--fg); background: var(--accent-soft); }
#dossier .dbody { overflow-y: auto; padding: 4px var(--pad) var(--pad); flex: 1; min-height: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.btn { border: 1px solid var(--line-strong); background: transparent; color: var(--fg); padding: 6px 11px; border-radius: 8px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn svg { width: 14px; height: 14px; }
.sec { border-top: 1px solid var(--line); }
.sec > button { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border: 0; background: none; text-align: left; font-weight: 600; font-size: 13.5px; }
.sec > button .q { color: var(--muted); font-weight: 400; font-size: 12px; }
.sec > button::after { content: "+"; color: var(--muted); font: 400 16px var(--f-mono); }
.sec.open > button::after { content: "−"; }
.sec .sbody { display: none; padding: 0 0 12px; color: var(--fg); font-size: 13.5px; }
.sec.open .sbody { display: block; }
.sec .sbody p { margin: 0 0 8px; max-width: 62ch; }
.sec .sbody .muted { color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
.relgroup { margin: 6px 0 10px; }
.relgroup .rl { font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.seqline { font: 12px var(--f-mono); color: var(--muted); }

/* causal chain */
.chain { margin: 12px 0 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.chain .eyebrow { display: flex; justify-content: space-between; }
.chaincols { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.ccol { flex: 0 0 auto; min-width: 84px; max-width: 132px; display: flex; flex-direction: column; gap: 4px; padding: 0 6px; position: relative; }
.ccol + .ccol::before { content: "→"; position: absolute; left: -7px; top: 18px; color: var(--faint); font-size: 12px; }
.ccol .ct { font: 500 9.5px var(--f-mono); color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }
.ccol.here .ct { color: var(--accent); }
.ccol .chip { font-size: 11.5px; }
.ccol .none { color: var(--faint); font-size: 12px; }

/* drill ladder */
.drill { margin: 10px 0; }
.drill ol { list-style: none; margin: 0; padding: 0; counter-reset: d; }
.drill li { display: grid; grid-template-columns: 22px 92px 1fr; gap: 8px; align-items: center; padding: 4px 0; position: relative; }
.drill li::before { counter-increment: d; content: counter(d); font: 500 10px var(--f-mono); color: var(--faint); width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; }
.drill li.done::before { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.drill li + li::after { content: ""; position: absolute; left: 9px; top: -6px; height: 10px; border-left: 1px solid var(--line-strong); }
.drill .lv { font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.drill .txt { font-size: 12.5px; color: var(--fg); min-width: 0; }

/* ---------- mechanism player ---------- */
#player { position: absolute; left: 104px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); z-index: 24; width: min(500px, calc(100vw - 560px)); min-width: 340px; display: flex; flex-direction: column; overflow: hidden; }
#player .ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
#player .ph b { font: 400 19px/1.1 var(--f-display); flex: 1; min-width: 0; }
#player canvas { width: 100%; height: 230px; display: block; }
#player .cap { padding: 8px 12px 4px; font-size: 13px; min-height: 64px; }

window.ATLAS = (function () {

    const p = g.attributes.position;

  }

  }
  function buildCell() {
    const G = (groups.cell = new THREE.Group());
    const cutDir = new THREE.Vector3(1, 0, 1).normalize();
    const membrane = new THREE.Mesh(blob(3, 72, 0.62, 0.05, 1.4, 1), stdMat(0x84b6cf, { opacity: 0.2, side: THREE.DoubleSide, depthWrite: false, roughness: 0.3 }));
    G.add(reg("o_membrane", membrane, "cell"));
    const rim = new THREE.Mesh(blob(2.96, 72, 0.62, 0.05, 1.4, 1), stdMat(0x84b6cf, { opacity: 0.12, side: THREE.BackSide, depthWrite: false }));
    G.add(rim);
    // nucleus with cutaway
    const nuc = new THREE.Mesh(blob(1.15, 56, 0.7, 0.03, 2, 7), stdMat(0x5a7fd8, { opacity: 0.62, side: THREE.DoubleSide, depthWrite: false }));
    G.add(reg("o_nucleus", nuc, "cell"));
    // pores
    const poreG = new THREE.TorusGeometry(0.045, 0.016, 6, 12), poreM = stdMat(0xbfd3ff, { opacity: 0.95 });
    const pores = new THREE.InstancedMesh(poreG, poreM, 110); const d = new THREE.Object3D();
    for (let i = 0; i < 110; i++) { const v = onSphere(1.16, cutDir); d.position.copy(v); d.lookAt(0, 0, 0); d.updateMatrix(); pores.setMatrixAt(i, d.matrix); }

    nl.position.set(0.18, 0.25, -0.2); G.add(reg("o_nucleolus", nl, "cell"));
    // chromatin threads (interphase territories)
    const chrM = stdMat(0x9a8cff, { opacity: 0.95, roughness: 0.4 });
    for (let c = 0; c < 9; c++) {
      const pts = []; let p = inShell(0.1, 0.75);
      for (let i = 0; i < 26; i++) { p = p.clone().add(new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.28)); if (p.length() > 0.95) p.multiplyScalar(0.85); pts.push(p); }

    const riboPts = [];

      const r = 1.42 + s * 0.11, th0 = rnd() * Math.PI * 2, tl = 0.5 + rnd() * 0.4;
      const g = new THREE.SphereGeometry(r, 40, 14, th0, 0.7 + rnd() * 0.5, 0.9 + rnd() * 0.9, tl * 0.75);
      const p = g.attributes.position, local = [];
      for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i); const k = 1 + 0.035 * Math.sin(x * 9 + s) * Math.cos(z * 7); p.setXYZ(i, x * k, y * k, z * k); if (i % 7 === 0) local.push(new THREE.Vector3(x * k * 1.012, y * k * 1.012, z * k * 1.012)); }

    riboPts.forEach((v, i) => { d.position.copy(v); d.scale.setScalar(1); d.updateMatrix(); ribo.setMatrixAt(i, d.matrix); });

    for (let i = 0; i < 14; i++) { const v = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), stdMat(0xf2b45c, { opacity: 1 })); v.position.copy(golgi.position).add(new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.9)); G.add(reg("o_golgi", v, "cell")); }
    // mitochondria
    const mitoOut = stdMat(0xff7d6b, { opacity: 0.55, depthWrite: false }), mitoIn = stdMat(0xd2483c, { opacity: 1 });
    for (let i = 0; i < 9; i++) {

    for (let i = 0; i < 7; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), stdMat(0x9ad66b, { opacity: 1 })); m.position.copy(inShell(1.6, 2.5)); G.add(reg("o_lyso", m, "cell")); }
    for (let i = 0; i < 34; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.045 + rnd() * 0.03, 10, 8), stdMat(0xffe08a, { opacity: 1 })); m.position.copy(onSphere(2.55 + rnd() * 0.3, cutDir)); G.add(reg("o_vesicle", m, "cell")); }

  /* ---------------- KARYOTYPE ---------------- */
  const CHR_S = 0.0105;
  const chrGroups = {}, geneRings = {};
  function chromatid(len, cen) {
    const top = cen * CHR_S, bot = -(len - cen) * CHR_S, r0 = 0.085, pts = [];
    const N = 70;
    for (let i = 0; i <= N; i++) {
      const y = lerp(bot, top, i / N);
      const dEnd = Math.min(y - bot, top - y);
      let r = r0 * (1 - 0.55 * Math.exp(-((y / 0.06) ** 2)));
      if (dEnd < r0) r *= Math.sqrt(Math.max(0, 1 - ((r0 - dEnd) / r0) ** 2));
      pts.push(new THREE.Vector2(Math.max(r, 0.001), y));
    }
    return new THREE.LatheGeometry(pts, 18);
  }
  function buildKaryotype() {
    const G = (groups.kary = new THREE.Group());
    const chrs = KG.D.entities.filter((e) => e.type === "chromosome");
    chrs.forEach((c, i) => {
      const row = i < 12 ? 0 : 1, col = row ? i - 12 : i;
      const grp = new THREE.Group();
      grp.position.set((col - 5.5) * 0.66, row ? -1.85 : 1.3, 0);
      const m = stdMat(0xb9a8e8, { opacity: 1, roughness: 0.5 });
      const g = chromatid(c.len, c.cen);
      [-1, 1].forEach((s) => { const mm = new THREE.Mesh(g, m); mm.position.x = s * 0.07; mm.rotation.z = s * 0.035; grp.add(reg(c.id, mm, "kary")); });
      // centromere marker
      const cm = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), stdMat(0x6a5ab8, { opacity: 1 })); grp.add(cm);
      chrGroups[c.id] = { grp, ent: c };
      G.add(grp);
      const lab = h("div", { class: "l3d", style: "transform:translate(-50%,0)" }, c.id.replace("chr", ""));
      labelEls.push({ el: lab, stage: "karyotype", pos: () => grp.position.clone().add(new THREE.Vector3(0, -(c.len - c.cen) * CHR_S - 0.12, 0)), kind: "chr", id: c.id });
      $("#labels").append(lab);
      // gene loci
      KG.D.entities.filter((e) => e.type === "gene" && e.chr === c.id.replace("chr", "")).forEach((gene) => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.022, 8, 28), stdMat(0x6ea8ff, { opacity: 1, emissive: 0x16306a }));
        ring.rotation.x = Math.PI / 2; ring.position.y = (c.cen - gene.mb) * CHR_S;
        grp.add(reg(gene.id, ring, "kary")); geneRings[gene.id] = ring;
        const gl = h("div", { class: "l3d", style: "font-family:var(--f-mono);font-style:italic" }, gene.name);
        labelEls.push({ el: gl, stage: "karyotype", pos: () => grp.position.clone().add(new THREE.Vector3(0.2, ring.position.y + 0.06, 0)), kind: "gene", id: gene.id });
        $("#labels").append(gl);
      });
    });
    ex.scene.add(G);
  }

  /* ---------------- CHROMATIN FIBRE ---------------- */
  function buildFiber() {
    const G = (groups.fiber = new THREE.Group());
    const N = 15, pts = [], centers = [];
    const hist = new THREE.InstancedMesh(new THREE.SphereGeometry(0.1, 14, 10), stdMat(0xffffff, { opacity: 1 }), N * 8);
    const HC = [0xf29bb3, 0xe07aa0, 0xb69cf0, 0x9a7ee0];
    const d = new THREE.Object3D(); let k = 0;
    for (let i = 0; i < N; i++) {
      const a = (i / 6) * Math.PI * 2, x = -3 + i * 0.42;
      const c = new THREE.Vector3(x, Math.cos(a) * 0.7, Math.sin(a) * 0.7);
      const radial = new THREE.Vector3(0, Math.cos(a), Math.sin(a));
      const axis = new THREE.Vector3(1, 0, 0).cross(radial).normalize();
      const u = radial.clone(), w = axis.clone().cross(u).normalize();
      centers.push(c);
      for (let layer = 0; layer < 2; layer++) for (let j = 0; j < 4; j++) {
        const b = (j / 4) * Math.PI * 2 + layer * 0.6;
        d.position.copy(c).add(u.clone().multiplyScalar(Math.cos(b) * 0.1)).add(w.clone().multiplyScalar(Math.sin(b) * 0.1)).add(axis.clone().multiplyScalar(layer ? 0.06 : -0.06));

        const t = s / 30, b = t * 1.65 * Math.PI * 2 + i * 0.3;

      }
      if (i < N - 1) { const mid = pts[pts.length - 1].clone().lerp(new THREE.Vector3(-3 + (i + 1) * 0.42, Math.cos(((i + 1) / 6) * Math.PI * 2) * 0.7, Math.sin(((i + 1) / 6) * Math.PI * 2) * 0.7), 0.5); mid.multiply(new THREE.Vector3(1, 1.25, 1.25)); pts.push(mid); }

  }

  /* ---------------- DNA HELIX ---------------- */
  const R = 0.35, RISE = 0.119, TWIST = (Math.PI * 2) / 10.5, MINOR = 2.55;
  const BASECOL = { A: 0xff8f6b, T: 0xffd66b, G: 0x6bd3ff, C: 0x9cf28a };
  let helixInfo = null;
  function constructSeq(key) {
    const c = KG.constructs[key]; let seq = "", segs = [];
    c.segments.forEach(([type, s]) => { segs.push({ type, from: seq.length, to: seq.length + s.length }); seq += s; });
    return { seq, segs, c };
  }
  function buildHelix() {
    if (groups.helix) { ex.scene.remove(groups.helix); groups.helix.traverse((o) => { o.geometry && o.geometry.dispose(); }); pickList.helix = []; entMats.k_dna = (entMats.k_dna || []).filter((m) => !m.__helix); }
    const G = (groups.helix = new THREE.Group());
    const { seq, segs, c } = constructSeq(construct);
    const n = seq.length, x0 = -(n * RISE) / 2;
    const s1 = [], s2 = [];
    for (let i = 0; i <= n * 2; i++) {
      const t = i / 2, th = t * TWIST, x = x0 + t * RISE;
      s1.push(new THREE.Vector3(x, R * Math.cos(th), R * Math.sin(th)));
      s2.push(new THREE.Vector3(x, R * Math.cos(th + MINOR), R * Math.sin(th + MINOR)));
    }
    const bbM = stdMat(0xcfd8e6, { opacity: 1, roughness: 0.3 }); bbM.__helix = true;
    G.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s1), n * 6, 0.04, 8, false), bbM));
    G.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s2), n * 6, 0.04, 8, false), bbM));
    const half = new THREE.CylinderGeometry(0.032, 0.032, 1, 8); half.translate(0, 0.5, 0);
    const bases = new THREE.InstancedMesh(half, stdMat(0xffffff, { opacity: 1, roughness: 0.45 }), n * 2);
    bases.material.__helix = true;
    const phos = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 10, 8), stdMat(0xe6c27a, { opacity: 1 }), n * 2);
    const d = new THREE.Object3D(), up = new THREE.Vector3(0, 1, 0), segOf = (i) => segs.find((s) => i >= s.from && i < s.to);
    for (let i = 0; i < n; i++) {
      const a = s1[i * 2], b = s2[i * 2], mid = new THREE.Vector3(a.x, (a.y + b.y) / 2 * 0.25, (a.z + b.z) / 2 * 0.25);

      [[a, seq[i]], [b, COMP[seq[i]]]].forEach(([p, base], k) => {

        d.position.copy(p); d.quaternion.setFromUnitVectors(up, dir.normalize()); d.scale.set(1, L, 1); d.updateMatrix();
        bases.setMatrixAt(i * 2 + k, d.matrix); bases.setColorAt(i * 2 + k, new THREE.Color(BASECOL[base]).multiplyScalar(dim));
        d.position.copy(p); d.quaternion.identity(); d.scale.set(1, 1, 1); d.updateMatrix(); phos.setMatrixAt(i * 2 + k, d.matrix);
      });
    }
    bases.instanceColor.needsUpdate = true;
    bases.userData.bp = true;
    G.add(reg("k_dna", bases, "helix"), phos);
    // gene map bands under the helix
    const SEGC = { promoter: 0xffc857, utr5: 0x8d9cb0, exon: 0x7cc4ff, intron: 0x5d6c80, utr3: 0x8d9cb0 };
    segs.forEach((s) => {
      const len = (s.to - s.from) * RISE;
      const band = new THREE.Mesh(new THREE.BoxGeometry(len - 0.02, s.type === "exon" ? 0.09 : 0.04, 0.04), stdMat(SEGC[s.type], { opacity: s.type === "intron" ? 0.6 : 1 }));
      band.position.set(x0 + (s.from + s.to) / 2 * RISE, -R - 0.32, 0); G.add(band);
      const name = { promoter: "Promoter · TATA box", utr5: "5′ UTR", exon: "Exon", intron: "Intron (spliced out)", utr3: "3′ UTR · AATAAA" }[s.type];
      const el = h("div", { class: "l3d" }, name); $("#labels").append(el);
      labelEls.push({ el, stage: "helix", pos: () => band.position.clone().add(new THREE.Vector3(0, -0.1, 0)), kind: "note", helix: true, below: true });
    });

    G.visible = stage === "helix"; ex.scene.add(G);
    renderSeqStrip();
  }
  function renderSeqStrip() {
    const el = $("#seqStrip"); if (!helixInfo) return;
    const { seq, segs, c } = helixInfo;
    const gene = geneFocus && KG.get(geneFocus);
    const html = segs.map((s) => `<span class="seg-${s.type}">${seq.slice(s.from, s.to).split("").map((b, j) => `<span class="b-${b}" data-i="${s.from + j}">${b}</span>`).join("")}</span>`).join("");
    el.innerHTML = `<div class="eyebrow" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>Coding strand 5′→3′ · ${esc(c.name)}</span><span style="display:inline-flex;gap:8px;align-items:center"><span id="bpInfo" class="mono">${seq.length} bp</span><button class="pmin" data-min="seqStrip" aria-label="Minimize sequence panel" title="Minimize">${ICON.min}</button></span></div>
      <div class="seq" id="seqText">${html}</div>
      ${gene && gene.id !== c.gene ? `<p style="margin:6px 0 0;font-size:12px;color:var(--muted)">You arrived from <b style="font-family:var(--f-mono);font-style:italic">${esc(gene.name)}</b> (chromosome ${esc(gene.chr + gene.band)}). This view shows a short teaching gene so each base is visible; <a href="https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(gene.name)}%5Bsym%5D+AND+human%5Borgn%5D" target="_blank" rel="noopener" style="color:var(--accent)">see the real ${esc(gene.name)} sequence on NCBI ↗</a></p>` : ""}
      <div class="actions" style="margin:8px 0 0"><button class="btn primary" data-act="sim">Transcribe & translate this gene →</button><button class="btn" data-act="swap">Switch to ${construct === "oxt" ? "Met-enkephalin" : "oxytocin"} gene</button></div>`;
    el.querySelector('[data-act="sim"]').onclick = () => { App.go("sim"); Sim.load(construct); };
    el.querySelector('[data-act="swap"]').onclick = () => { setConstruct(construct === "oxt" ? "penk" : "oxt"); };
  }
  function setConstruct(k) { construct = k; labelEls.filter((l) => l.helix).forEach((l) => l.el.remove()); for (let i = labelEls.length - 1; i >= 0; i--) if (labelEls[i].helix) labelEls.splice(i, 1); buildHelix(); }

  /* ---------------- stage control ---------------- */
  function setStage(id, opts = {}) {
    stage = id;
    const st = STAGES.find((s) => s.id === id);
    Object.entries(groups).forEach(([g, grp]) => (grp.visible = g === st.group));
    if (opts.fly !== false) GFX.fly(ex, st.cam[0], st.cam[1], 1.0);
    State.cellStage = id; saveState();
    $("#seqStrip").hidden = id !== "helix" || App.view !== "cell";
    renderLadder();
    Bus.emit("cell:stage", id);
  }
  function renderLadder() {
    const L = $("#ladderRungs"); if (!L) return;
    L.innerHTML = "";
    STAGES.forEach((s) => L.append(h("button", { class: "rung", "aria-current": s.id === stage ? "step" : null, onclick: () => setStage(s.id) }, h("i"), h("span", null, s.name), h("small", null, s.note))));
  }

  /* ---------------- interaction ---------------- */
  ex.pickables = () => {
    const st = STAGES.find((s) => s.id === stage);
    return pickList[st.group].filter((o) => o.visible !== false && (!o.material || o.material.opacity > 0.08));

    { id: "processing", name: "RNA processing", lv: "intermediate" },
    { id: "export", name: "Nuclear export", lv: "detailed" },

  const MOL = {
    dna: "B-form DNA turns once every ~10.5 bp (3.4 nm). The two strands run antiparallel, and the major and minor grooves expose the edges of the bases, which transcription factors read without unwinding the helix.",
    transcription: "TFIID's TATA-binding protein bends DNA at the TATA box, ~25–30 bp upstream of the start site. TFIIH phosphorylates Ser5 of RNA polymerase II's C-terminal domain to release it from the promoter; Ser2 phosphorylation marks productive elongation, which proceeds at a few kilobases per minute.",
    processing: "The 5′ cap is a 7-methylguanosine joined 5′-to-5′ through a triphosphate. U1 snRNP pairs with the 5′ splice site (GU), U2 with the branch point; the branch-point A attacks the 5′ splice site and forms a lariat, and the freed exon end joins the next exon. CPSF recognizes AAUAAA, the RNA is cut 10–30 nt downstream, and poly(A) polymerase adds roughly 200 adenosines.",
    export: "Splicing leaves exon-junction complexes on the mRNA; with the TREX complex they recruit the export receptor NXF1–NXT1, which carries the mRNA through the FG-repeat mesh of the nuclear pore.",
    translation: "eIF4E binds the cap and the small subunit scans to the first AUG in good Kozak context (GCCACCAUGG). Aminoacyl-tRNA synthetases charge each tRNA; eEF1A delivers it to the A site; the large subunit's rRNA forms the peptide bond (the ribosome is a ribozyme); eEF2 moves the ribosome one codon. eRF1 recognizes the stop codon.",
    protein: "Folding is driven by burying hydrophobic side chains. Disulfide bonds form in the oxidizing lumen of the endoplasmic reticulum, catalyzed by protein disulfide isomerase; secreted peptides are then trimmed and modified in the Golgi and secretory granules."

  /* ---------- derive everything from the construct ---------- */
  function data() {
    const c = key === "custom" ? custom : KG.constructs[key];
    const segs = []; let seq = "";

  function build() {

        <div class="seg" id="simLevel" role="group" aria-label="Level of detail">${LEVELS.map((l) => `<button data-l="${l}">${l[0].toUpperCase() + l.slice(1)}</button>`).join("")}</div></div>

            <button class="btn" id="simPlay">${ICON.play} Animate</button>
            <button class="btn" id="simAuto" aria-pressed="false" title="Play through all stages">Play all stages</button>
            <button class="btn primary" id="simNext">Next ${ICON.next}</button>
            <span style="flex:1"></span>

    const introns = d.preSegs.filter((s) => s.type === "intron").length;
    const phase = !capOn ? "Starting" : splice <= 0 ? "Adding the 5′ cap" : splice < 1 ? "Splicing: the intron's GU…AG boundaries are recognized and it is removed as a lariat" : !polyOn ? "Exons joined" : "Cleaving after AAUAAA and adding the poly(A) tail";
    return `<h3>RNA processing</h3><p class="lede">Before it can leave the nucleus, the pre-mRNA is capped at its 5′ end, its introns are spliced out and its exons joined, and a poly(A) tail is added at the 3′ end. Cap and tail protect the mRNA and help ribosomes find it.</p>
      <div class="legend"><span class="mono" style="color:var(--accent)">${phase}</span></div>
      <div class="track" style="gap:2px">${items.join("")}</div>
      ${introns ? `<p style="font-size:13px;color:var(--muted);max-width:68ch;margin-top:12px">This intron begins with <b class="mono">GU</b> and ends with <b class="mono">AG</b> — the near-universal splice-site signals — and contains a branch-point A in <b class="mono">…CUAAC…</b>.</p>` : `<p style="font-size:13px;color:var(--muted)">This sequence has no introns, so there is nothing to splice.</p>`}
      ${prog >= 1 ? `<p>Mature mRNA: <b class="mono">${d.mature.length} nt</b> + cap + poly(A) tail.</p>` : ""}${mol("processing")}`;
  }
  function sExport() {
    const x = lerp(60, 520, ease(prog));
    return `<h3>Nuclear export</h3><p class="lede">The mature mRNA, bound by proteins that mark it as fully processed, is carried through a nuclear pore complex into the cytoplasm. Unspliced or damaged RNAs are held back and degraded.</p>
      <svg class="schem" viewBox="0 0 680 230" role="img" aria-label="mRNA passing through a nuclear pore">
        <rect x="0" y="0" width="300" height="230" fill="var(--t-gene)" opacity=".07"/>
        <text x="16" y="24" fill="var(--muted)" font-size="12" font-family="var(--f-mono)">NUCLEUS</text>
        <text x="560" y="24" fill="var(--muted)" font-size="12" font-family="var(--f-mono)">CYTOPLASM</text>
        <path d="M300 0 V90 M318 0 V90 M300 140 V230 M318 140 V230" stroke="var(--t-organelle)" stroke-width="3"/>
        <rect x="292" y="86" width="34" height="8" rx="3" fill="var(--t-organelle)"/><rect x="292" y="136" width="34" height="8" rx="3" fill="var(--t-organelle)"/>
        <text x="330" y="80" fill="var(--t-organelle)" font-size="12">nuclear pore complex</text>
        <g transform="translate(${x - 60},115)">
          <circle cx="0" cy="0" r="7" fill="var(--t-pathway)"/>
          <path d="M8 0 ${Array.from({ length: 10 }, (_, i) => `Q${14 + i * 12} ${i % 2 ? 6 : -6} ${20 + i * 12} 0`).join(" ")}" stroke="var(--accent)" stroke-width="3" fill="none"/>
          <text x="128" y="4" fill="var(--muted)" font-size="11" font-family="var(--f-mono)">AAAA…</text>
          <text x="-6" y="-14" fill="var(--fg)" font-size="11">mRNA</text>
        </g>
        ${prog > 0.85 ? `<g opacity="${(prog - 0.85) / 0.15}"><ellipse cx="610" cy="170" rx="34" ry="18" fill="var(--t-protein)" opacity=".25" stroke="var(--t-protein)"/><ellipse cx="610" cy="152" rx="24" ry="12" fill="var(--t-protein)" opacity=".2" stroke="var(--t-protein)"/><text x="610" y="205" fill="var(--t-protein)" font-size="11" text-anchor="middle">ribosome</text></g>` : ""}
      </svg>${mol("export")}`;
  }
  function sTranslation(d) {
    if (d.startAt < 0) return `<h3>Translation</h3><p class="lede">No AUG start codon was found in this mRNA, so a ribosome would not start translating it.</p>`;
    const n = d.codons.length, j = Math.min(n - 1, Math.floor(prog * n));
    const lead = d.mature.slice(0, d.startAt);
    const cards = d.codons.map((c, i) => {
      const ac = c.cd.split("").map((b) => RNACOMP[b]).join("");
      const cls = i === j && prog < 1 ? "active" : i > j ? "ghost" : "";
      return `<div class="codon ${cls} ${c.aa === "*" ? "stop" : ""}"><div class="cs">${c.cd.split("").map((b) => nt(b)).join("")}</div>
        <div class="ac" title="tRNA anticodon (3′→5′)">${i <= j ? (c.aa === "*" ? "eRF1" : "3′-" + ac + "-5′") : "&nbsp;"}</div>
        <div class="aa">${i <= j ? AA3[c.aa] : "&nbsp;"}</div></div>`;
    }).join("");
    const pep = d.codons.slice(0, j + 1).filter((c) => c.aa !== "*").map((c, i) => (i ? '<span class="aa-link"></span>' : "") + `<span class="aa-bead ${c.aa === "C" ? "cys" : ""}" title="${AA3[c.aa]}">${AA3[c.aa]}</span>`).join("");
    const cur = d.codons[j] || { cd: "", aa: "*" };
    return `<h3>Translation</h3><p class="lede">In the cytoplasm a ribosome reads the mRNA three bases at a time. Each codon is matched by a tRNA whose anticodon pairs with it, and the tRNA's amino acid is added to the growing chain. A stop codon releases the finished chain.</p>
      <div class="legend"><span class="mono" style="color:var(--accent)">${prog < 1 ? `Codon ${j + 1}: ${cur.cd} → ${AA3[cur.aa]}` : `Done: ${d.protein.length} amino acids`}</span>
        <span>5′ cap → <span class="mono">${lead.length}</span> nt of 5′ UTR scanned before the first AUG</span></div>
      <div class="codons">${cards}</div>
      <div class="eyebrow">Growing polypeptide (N → C)</div><div class="peptide">${pep}</div>
      ${!d.hasStop ? `<p style="color:var(--bad);font-size:13px">No in-frame stop codon — a real ribosome would stall at the end of this mRNA.</p>` : ""}${mol("translation")}`;
  }
  function sProtein(d) {
    const aa = d.protein, isOxt = key === "oxt";
    const n = aa.length, R = 70, cx = 200, cy = 120;
    let svg = "";
    if (n) {
      const e = ease(prog);
      const pts = aa.map((_, i) => {
        const lin = [30 + i * 44, 120];
        let fold;
        if (isOxt) {
          if (i === 0) fold = [cx + R * 0.5 + 18, cy + R * 0.87 + 46];
          else if (i <= 6) { const a = ((i === 6 ? 0 : i * 60) * Math.PI) / 180; fold = [cx + Math.cos(a) * R, cy + Math.sin(a) * R]; }
          else fold = [cx + R + 44 * (i - 6), cy];
        } else fold = [30 + i * 44, 120 + Math.sin(i * 1.1) * 26];
        return [lerp(lin[0], fold[0], e), lerp(lin[1], fold[1], e)];
      });
      const lines = pts.slice(1).map((p, i) => `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line-strong)" stroke-width="2"/>`).join("");
      const ss = isOxt && prog > 0.7 ? `<line x1="${pts[1][0]}" y1="${pts[1][1]}" x2="${pts[6][0]}" y2="${pts[6][1]}" stroke="var(--t-transmitter)" stroke-width="3" stroke-dasharray="5 3"/><text x="${(pts[1][0] + pts[6][0]) / 2 + 24}" y="${(pts[1][1] + pts[6][1]) / 2 + 4}" text-anchor="start" fill="var(--t-transmitter)" font-size="11">S–S bond</text>` : "";
      const beads = pts.map((p, i) => `<g><circle cx="${p[0]}" cy="${p[1]}" r="17" fill="var(--panel-solid)" stroke="${aa[i] === "C" ? "var(--t-transmitter)" : "var(--t-protein)"}" stroke-width="1.6"/><text x="${p[0]}" y="${p[1] + 4}" text-anchor="middle" fill="var(--fg)" font-size="10.5" font-family="var(--f-mono)">${AA3[aa[i]]}</text></g>`).join("");
      const w = Math.max(...pts.map((p) => p[0])) + 30;
      svg = `<svg class="schem" viewBox="0 0 ${Math.max(480, w)} 240" role="img" aria-label="Folding polypeptide">${lines}${ss}${beads}</svg>`;
    }
    const ent = d.c.protein && KG.get(d.c.protein);
    const regions = ent ? KG.regionsFor(ent.id) : [];
    return `<h3>Protein & function</h3><p class="lede">The chain folds into its working shape. ${esc(d.c.fold || "Short peptides like this one may stay unfolded; longer chains fold into domains.")}</p>
      ${svg}
      <div class="legend"><span>One-letter sequence: <b class="mono" style="color:var(--t-protein)">${aa.join("") || "—"}</b></span><span class="mono">${aa.length} aa</span></div>
      ${d.c.fn ? `<div class="card" style="margin-top:10px"><div class="eyebrow">Functional outcome</div><p style="color:var(--fg);margin:0 0 8px">${esc(d.c.fn)}</p>
        ${ent ? `<div class="chiprow">${chipHTML(ent.id)}${d.c.gene ? chipHTML(d.c.gene) : ""}${regions.map((r) => chipHTML(r)).join("")}</div>` : ""}
        ${ent ? `<div class="actions"><button class="btn" onclick="App.open('${ent.id}')">Open ${esc(ent.name)}</button>${regions[0] ? `<button class="btn" onclick="App.go('brain');App.open('${regions[0]}')">See it in the brain</button>` : ""}</div>` : ""}</div>` : ""}
      ${mol("protein")}`;
  }
  return { build, load, render, get key() { return key; } };
})();

/* =========================================================================
   RELATIONSHIP MAP — layered causal graph: Gene → Protein → Signal → Pathway
   → Cell → Region → Function. Clicking a node lights its full up/down chain.
   ========================================================================= */
const MapView = (function () {
  let root, wrap, svg, vb = null, focus = null, built = false;
  const COLW = 190, ROWH = 26, TOP = 46;
  const pos = {};
  function layout() {
    const cols = KG.TIER_TYPES.map((t) => KG.D.entities.filter((e) => e.type === t).map((e) => e.id));
    cols.forEach((c) => c.sort((a, b) => KG.get(a).name.localeCompare(KG.get(b).name)));
    // barycentric ordering sweeps to untangle edges
    const idx = {}; const setIdx = () => cols.forEach((c) => c.forEach((id, i) => (idx[id] = i / Math.max(1, c.length - 1))));
    setIdx();
    for (let sweep = 0; sweep < 8; sweep++) {
      const order = sweep % 2 ? [...cols.keys()].reverse() : [...cols.keys()];
      order.forEach((t) => {
        const bc = {};
        cols[t].forEach((id) => { const ns = KG.neighbors(id).filter((n) => KG.tierOf(n.id) >= 0 && KG.tierOf(n.id) !== t); bc[id] = ns.length ? ns.reduce((s, n) => s + idx[n.id], 0) / ns.length : idx[id]; });
        cols[t].sort((a, b) => bc[a] - bc[b]); setIdx();
      });
    }
    const maxN = Math.max(...cols.map((c) => c.length));
    cols.forEach((c, t) => { const off = ((maxN - c.length) * ROWH) / 2; c.forEach((id, i) => (pos[id] = [60 + t * COLW, TOP + 20 + off + i * ROWH])); });
    return { W: 60 + 6 * COLW + 170, H: TOP + 40 + maxN * ROWH };
  }
  function build() {
    root = $("#viewMap");
    root.innerHTML = `<div class="vhead"><div class="grow"><div class="eyebrow">Biological relationship map</div><h1>How the pieces connect</h1>
      <p>Each column is one level of biology, from genes on the left to functions on the right. Select any node to light up everything it causes and everything it depends on.</p></div>
      <div class="seg"><button id="mapFit">Fit</button><button id="mapClear">Clear focus</button></div></div>
      <div class="mapwrap" id="mapWrap"></div>`;
    wrap = $("#mapWrap");
    $("#mapFit").onclick = fit; $("#mapClear").onclick = () => setFocus(null);
  }
  function draw() {
    const { W, H } = layout();
    const NS = "http://www.w3.org/2000/svg";
    const col = (t) => `var(--t-${t})`;
    let s = `<g class="cols">${KG.TIER_NAMES.map((n, t) => `<text class="colhead" x="${60 + t * COLW}" y="${TOP - 10}">${n}</text>`).join("")}</g><g class="edges">`;
    KG.edges.forEach((e, i) => {
      if (!pos[e.a] || !pos[e.b]) return;
      const [x0, y0] = pos[e.a], [x1, y1] = pos[e.b];
      const same = x0 === x1;
      const d = same ? `M${x0} ${y0} C${x0 - 60} ${y0} ${x1 - 60} ${y1} ${x1} ${y1}` : `M${x0} ${y0} C${(x0 + x1) / 2} ${y0} ${(x0 + x1) / 2} ${y1} ${x1} ${y1}`;
      s += `<path class="edge" data-a="${e.a}" data-b="${e.b}" d="${d}"/>`;
    });
    s += `</g><g class="nodes">`;
    Object.entries(pos).forEach(([id, [x, y]]) => {
      const e = KG.get(id);
      s += `<g class="node ${e.type}" data-id="${id}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(e.name)}"><circle r="6" fill="${col(e.type)}" stroke="var(--void)"/><text x="11" y="4">${esc(e.name.length > 26 ? e.name.slice(0, 25) + "…" : e.name)}</text></g>`;
    });
    s += `</g>`;
    wrap.innerHTML = `<svg xmlns="${NS}" id="mapSvg" role="img" aria-label="Relationship map">${s}</svg><div class="maphint glass">Drag to pan · scroll or pinch to zoom · select a node</div>`;
    svg = $("#mapSvg");
    vb = { x: 0, y: 0, w: W, h: H, W, H };
    fit();
    svg.querySelectorAll(".node").forEach((n) => {
      n.addEventListener("click", (ev) => { ev.stopPropagation(); if (dragged) return; App.open(n.dataset.id, { from: "map" }); });
      n.addEventListener("keydown", (ev) => { if (ev.key === "Enter") App.open(n.dataset.id, { from: "map" }); });
    });
    pan();
    built = true;
    if (focus) setFocus(focus);
  }
  function apply() { svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
  function fit() {
    if (!svg) return;
    const r = wrap.getBoundingClientRect(), ar = r.width / Math.max(1, r.height);
    // keep text readable: never start below ~85% scale; centre on the focus if there is one
    const w = Math.min(Math.max(vb.W, vb.H * ar), r.width / 0.85), h = w / ar;
    const c = focus && pos[focus] ? pos[focus] : [vb.W / 2, vb.H / 2];
    vb.w = w; vb.h = h;
    vb.x = clamp(c[0] - w / 2, Math.min(0, (vb.W - w) / 2), Math.max(0, vb.W - w));
    vb.y = clamp(c[1] - h / 2, Math.min(0, (vb.H - h) / 2), Math.max(0, vb.H - h));
    apply();
  }
  let dragged = false;
  function pan() {
    let start = null; const pts = new Map(); let pinch0 = null;
    wrap.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, e); start = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; dragged = false; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), w: vb.w, h: vb.h }; } });
    wrap.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
      const r = wrap.getBoundingClientRect(), k = vb.w / r.width;
      if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoomTo(pinch0.w * (pinch0.d / d), r.width / 2, r.height / 2); dragged = true; return; }
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.hypot(dx, dy) > 4) { dragged = true; if (e.target.setPointerCapture) wrap.setPointerCapture(e.pointerId); }
      vb.x = start.vx - dx * k; vb.y = start.vy - dy * k; apply();
    });
    const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; start = null; setTimeout(() => (dragged = false), 0); };
    wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
    wrap.addEventListener("wheel", (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomTo(vb.w * Math.exp(e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  }
  function zoomTo(w, px, py) {
    const r = wrap.getBoundingClientRect(); w = clamp(w, 200, vb.W * 2.2);
    const h2 = w * (r.height / r.width), fx = px / r.width, fy = py / r.height;
    vb.x += (vb.w - w) * fx; vb.y += (vb.h - h2) * fy; vb.w = w; vb.h = h2; apply();
  }
  function chainSet(id) {
    const on = new Set([id]);
    [true, false].forEach((up) => {
      const q = [id];
      while (q.length) { const c = q.shift(), tc = KG.tierOf(c); KG.neighbors(c).forEach((n) => { const tn = KG.tierOf(n.id); if (tn < 0 || on.has(n.id) && n.id !== id) return; if (up ? tn > tc : tn < tc) { if (!on.has(n.id)) { on.add(n.id); q.push(n.id); } } }); }
    });
    return on;
  }
  function setFocus(id) {
    focus = id && pos[id] ? id : null;
    if (!svg) return;
    wrap.classList.toggle("focus", !!focus);
    svg.querySelectorAll(".node").forEach((n) => n.classList.remove("on", "sel"));
    svg.querySelectorAll(".edge").forEach((e) => e.classList.remove("on"));
    if (!focus) return;
    const on = chainSet(focus);
    svg.querySelectorAll(".node").forEach((n) => { if (on.has(n.dataset.id)) n.classList.add("on"); if (n.dataset.id === focus) n.classList.add("sel"); });
    svg.querySelectorAll(".edge").forEach((e) => { if (on.has(e.dataset.a) && on.has(e.dataset.b) && KG.tierOf(e.dataset.a) !== KG.tierOf(e.dataset.b)) e.classList.add("on"); });
    // centre the focused node if it's off-screen
    const [x, y] = pos[focus];
    if (x < vb.x || x > vb.x + vb.w || y < vb.y || y > vb.y + vb.h) { vb.x = x - vb.w / 2; vb.y = y - vb.h / 2; apply(); }
  }
  function show() { if (!built) draw(); else fit(); }
  return { build, show, setFocus };
})();

/* =========================================================================
   STUDY MODE — a guided descent from structure to gene, plus questions
   generated from the knowledge graph (so new content adds new questions).
   ========================================================================= */
const Study = (function () {
  let root, region = "hippocampus", q = null, answered = false, orderPick = [];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ofType = (t) => KG.D.entities.filter((e) => e.type === t);
  const STEPS = [
    ["Select the structure in the 3D brain", (r) => { App.go("brain"); App.open(r); }],
    ["Read what it does and how", (r) => { App.open(r); App.expand(["does", "how"]); }],
    ["Watch the mechanism animation", (r) => { App.go("brain"); App.open(r, { quiet: true }); Mech.open(r); }],
    ["Explore the signaling pathway", (r) => App.open(KG.get(r).drill.pathway)],
    ["Explore the receptor protein", (r) => App.open(KG.get(r).drill.receptor)],
    ["Explore the gene that encodes it", (r) => App.open(KG.get(r).drill.gene)],
    ["Rebuild the chain from DNA to function", (r) => { newQuestion("chain", r); }]
  ];
  const prog = () => (State.study[region] = State.study[region] || {});
  function mark(i) { if (!prog()[i]) { prog()[i] = true; saveState(); if (!root.hidden) renderPath(); } }
  function track() {
    Bus.on("open", (id) => {
      const d = KG.get(region).drill;
      if (id === region) { mark(0); }
      if (id === d.pathway) mark(3);
      if (id === d.receptor) mark(4);
      if (id === d.gene) mark(5);
    });
    Bus.on("expand", (k) => { if (App.current === region && (k === "does" || k === "how")) mark(1); });
    Bus.on("mech:play", (r) => { if (r === region) mark(2); });
  }
  function build() {
    root = $("#viewStudy");
    root.innerHTML = `<div class="vhead"><div class="grow"><div class="eyebrow">Study mode</div><h1>Build the mechanism in your head</h1>
      <p>Follow a guided descent from a brain structure to its genes, then test whether you can rebuild the causal chain yourself.</p></div>
      <span class="score" id="score"></span></div>
      <div class="studywrap"><section class="card" id="pathCard"></section><section class="card quiz" id="quizCard"></section></div>`;
    track();
    renderPath(); newQuestion();
  }
  function renderPath() {
    const regions = ofType("region").filter((r) => r.drill);
    const p = prog(), done = Object.keys(p).length;
    $("#pathCard").innerHTML = `<h3>Guided path</h3><p>Choose a structure. Each step opens the right place in the atlas and ticks itself off when you get there.</p>
      <label class="srow" style="grid-template-columns:auto 1fr;gap:10px"><span>Structure</span>
        <select id="pathRegion">${regions.map((r) => `<option value="${r.id}" ${r.id === region ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
      <div class="score" style="margin:6px 0">${done} of ${STEPS.length} steps done</div>
      <ol class="steps">${STEPS.map(([label], i) => `<li class="${p[i] ? "done" : ""}"><span class="tick">${p[i] ? "✓" : i + 1}</span><span class="lbl">${label}</span><button class="btn" data-step="${i}">Go</button></li>`).join("")}</ol>
      <div class="chain" style="margin-top:14px"><div class="eyebrow"><span>This path</span></div>
        <div class="chiprow">${["gene", "receptor", "pathway", "cell"].map((k) => KG.get(KG.get(region).drill[k])).filter(Boolean).map((e) => chipHTML(e.id)).join('<span style="color:var(--faint)">→</span>')}<span style="color:var(--faint)">→</span>${chipHTML(region)}</div></div>`;
    $("#pathRegion").onchange = (e) => { region = e.target.value; renderPath(); };
    $$("#pathCard [data-step]").forEach((b) => (b.onclick = () => STEPS[+b.dataset.step][1](region)));
    $("#score").textContent = `Score ${State.quiz.right} / ${State.quiz.total}`;
  }

  /* ---------- question generators ---------- */
  const GEN = {
    gene() {
      const p = pick(ofType("protein").filter((x) => x.genes && x.genes.length));
      const right = p.genes[0], wrong = shuffle(ofType("gene").filter((g) => !p.genes.includes(g.id))).slice(0, 3);
      return { text: `Which gene encodes ${p.name}?`, opts: shuffle([right, ...wrong.map((g) => g.id)]), answer: right, explain: `${KG.get(right).name} is on chromosome ${KG.get(right).chr}${KG.get(right).band}. ${p.short}`, about: p.id };
    },
    region() {
      const f = pick(ofType("function").filter((x) => KG.neighbors(x.id).some((n) => n.rel === "supports")));
      const rs = KG.neighbors(f.id).filter((n) => n.rel === "supports").map((n) => n.id), right = pick(rs);
      const wrong = shuffle(ofType("region").filter((r) => !rs.includes(r.id))).slice(0, 3).map((r) => r.id);
      return { text: `Which structure contributes most directly to ${f.name.toLowerCase()}?`, opts: shuffle([right, ...wrong]), answer: right, explain: `${KG.get(right).name}: ${KG.get(right).short}`, about: right };
    },
    pathway() {
      const p = pick(ofType("protein").filter((x) => KG.neighbors(x.id).some((n) => n.rel === "participates")));
      const ps = KG.neighbors(p.id).filter((n) => n.rel === "participates").map((n) => n.id), right = pick(ps);
      const wrong = shuffle(ofType("pathway").filter((w) => !ps.includes(w.id))).slice(0, 3).map((w) => w.id);
      return { text: `${p.name} takes part in which pathway?`, opts: shuffle([right, ...wrong]), answer: right, explain: `${KG.get(right).name}: ${KG.get(right).short}`, about: right };
    },
    cell() {
      const t = pick(ofType("transmitter"));
      const cs = KG.neighbors(t.id).filter((n) => n.rel === "releases").map((n) => n.id), right = pick(cs);
      const wrong = shuffle(ofType("cell").filter((c) => !cs.includes(c.id) && KG.neighbors(c.id).some((n) => n.rel === "releases"))).slice(0, 3).map((c) => c.id);
      return { text: `Which of these cells releases ${t.name.toLowerCase() === "gaba" ? "GABA" : t.name.toLowerCase()}?`, opts: shuffle([right, ...wrong]), answer: right, explain: `${KG.get(right).name}: ${KG.get(right).short}`, about: right };
    },
    chain(r) {
      r = r || pick(ofType("region").filter((x) => x.drill)).id;
      const d = KG.get(r).drill, fn = KG.neighbors(r).find((n) => n.rel === "supports");
      const items = [d.gene, d.receptor, d.pathway, d.cell, r, fn && fn.id].filter((x) => x && KG.get(x));
      const uniq = [...new Set(items)];
      return { kind: "order", text: `Put these in causal order, starting from DNA: how does ${KG.get(r).name.toLowerCase()} get from a gene to ${fn ? KG.get(fn.id).name.toLowerCase() : "its function"}?`, items: shuffle(uniq), answer: uniq, explain: uniq.map((x) => KG.get(x).name).join(" → "), about: r };
    }
  };
  function newQuestion(type, arg) {
    if (!type) type = pick(["gene", "region", "pathway", "chain", "cell", "gene", "region"]);
    if (type === "chain" && arg) region = arg;
    q = GEN[type](arg); q.type = type; answered = false; orderPick = [];
    if (App.view !== "study" && type === "chain" && arg) App.go("study");
    renderQ();
  }
  function renderQ() {
    const c = $("#quizCard");
    if (q.kind === "order") {
      c.innerHTML = `<h3>Rebuild the chain</h3><p class="qtext">${esc(q.text)}</p>
        <div class="eyebrow">Your order</div><div class="order" id="ordered">${orderPick.map((x) => chipHTML(x).replace("data-open", "data-x")).join('<span style="color:var(--faint)">→</span>') || '<span style="color:var(--faint);font-size:12px">Tap items below in order</span>'}</div>
        <div class="eyebrow" style="margin-top:8px">Items</div><div class="chiprow" id="pool">${q.items.filter((x) => !orderPick.includes(x)).map((x) => chipHTML(x).replace("data-open", "data-p")).join("")}</div>
        <div class="actions"><button class="btn" id="qUndo">Undo</button><button class="btn primary" id="qCheck" ${orderPick.length < q.items.length ? "disabled" : ""}>Check</button><button class="btn" id="qNext">New question</button></div><div id="fb"></div>`;
      $$("#pool [data-p]").forEach((b) => (b.onclick = () => { if (answered) return; orderPick.push(b.dataset.p); renderQ(); }));
      $("#qUndo").onclick = () => { if (!answered) { orderPick.pop(); renderQ(); } };
      $("#qCheck").onclick = () => {
        if (answered) return; answered = true;
        const ok = orderPick.every((x, i) => x === q.answer[i]);
        score(ok);
        if (ok && q.about === region) mark(6);
        $("#fb").innerHTML = `<div class="feedback"><b style="color:${ok ? "var(--good)" : "var(--bad)"}">${ok ? "Correct." : "Not quite."}</b> ${esc(q.explain)}<div class="chiprow" style="margin-top:6px">${chipHTML(q.about)}</div></div>`;
      };
    } else {
      c.innerHTML = `<h3>Practice</h3><p class="qtext">${esc(q.text)}</p><div class="opts">${q.opts.map((o) => `<button class="opt" data-o="${o}">${esc(KG.get(o).name)}<span style="color:var(--muted);font-size:11.5px"> · ${esc(KG.TYPE_LABEL[KG.get(o).type])}</span></button>`).join("")}</div>
        <div class="actions"><button class="btn" id="qNext">New question</button></div><div id="fb"></div>`;
      $$(".opt").forEach((b) => (b.onclick = () => {
        if (answered) return; answered = true;
        const ok = b.dataset.o === q.answer; score(ok);
        $$(".opt").forEach((x) => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
        $("#fb").innerHTML = `<div class="feedback"><b style="color:${ok ? "var(--good)" : "var(--bad)"}">${ok ? "Correct." : "Not quite."}</b> ${esc(q.explain)}<div class="chiprow" style="margin-top:6px">${chipHTML(q.about)}${q.about !== q.answer ? chipHTML(q.answer) : ""}</div></div>`;
      }));
    }
    $("#qNext").onclick = () => newQuestion();
  }
  function score(ok) { State.quiz.total++; if (ok) State.quiz.right++; saveState(); $("#score").textContent = `Score ${State.quiz.right} / ${State.quiz.total}`; }
  return { build, renderPath, newQuestion, set region(r) { region = r; } };
})();

/* =========================================================================
   UI — router, dossier, journey, search palette, settings, toolbars, boot
   ========================================================================= */
const App = {
  view: "brain", current: null, openSecs: new Set(["what", "does"]),
  is3D(v) { return v === "brain" || v === "cell"; },
  home(e) {
    if (!e) return null;
    if (e.type === "region") return "brain";
    if (["gene", "organelle", "chromosome"].includes(e.type)) return "cell";
    if (e.type === "concept") return e.stage === "sim" ? null : "cell";
    return null;
  },
  go(view) {
    if (!["brain", "cell", "sim", "map", "study"].includes(view)) view = "brain";
    if (this.view === "brain" && view !== "brain" && Mech.open_) Mech.close();
    this.view = State.view = view; saveState();
    $$("#rail [data-view]").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
    $("#brainTools").hidden = view !== "brain";
    $("#ladder").hidden = view !== "cell";
    $("#scalebar").hidden = view !== "cell";
    $("#viewSim").hidden = view !== "sim";
    $("#viewMap").hidden = view !== "map";
    $("#viewStudy").hidden = view !== "study";
    if (GFX.renderer) GFX.activate(this.is3D(view) ? view : null);
    if (view === "map") { MapView.show(); if (this.current) MapView.setFocus(this.current); }
    if (view === "study") Study.renderPath();
    if (view === "cell") { Cell.renderLadder(); $("#seqStrip").hidden = Cell.stage !== "helix"; }
    if (view === "sim") Sim.render();
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    Bus.emit("view", view);
  },
  open(id, opts = {}) {
    const e = KG.get(id);
    if (!e) return;
    this.current = State.entity = id;
    if (!opts.nojourney) { State.journey = State.journey.filter((x) => x !== id); State.journey.push(id); if (State.journey.length > 14) State.journey.shift(); }
    renderJourney();
    Dossier.render(e);
    const home = this.home(e);
    const transport = home && !opts.stay && (opts.from === "search" || opts.from === "study" || this.is3D(this.view));
    if (transport && home !== this.view) this.go(home);
    const v = this.view;
    if (v === "brain") {
      if (e.type === "region") Brain.select(id, { fly: opts.fly !== false });
      else Brain.highlight(KG.regionsFor(id));
    } else if (v === "cell") {
      if (home === "cell") Cell.focusEntity(id);
      else if (e.loc) Cell.showLoc(e.loc);
    } else if (!this.is3D(v) && opts.from === "search" && !home && KG.regionsFor(id).length) {
      this.go("brain"); Brain.highlight(KG.regionsFor(id));
    }
    if (this.view === "map") MapView.setFocus(id);
    if (e.type === "region") { const dd = (State.drillDone[id] = State.drillDone[id] || {}); dd.region = true; }
    Object.entries(State.drillDone).forEach(([r, dd]) => { const d = KG.get(r).drill; if (d) Object.entries(d).forEach(([k, v]) => { if (v === id) dd[k] = true; }); });
    saveState();
    Bus.emit("open", id);
    if (Settings.narration && !opts.quiet) Voice.speak(e.name + ". " + (e.short || "") + " " + (e.type === "region" ? e.does : ""));
  },
  close() {
    Dossier.hide(); this.current = null; State.entity = null; saveState();
    Brain.clear(); Cell.clearSel(); MapView.setFocus(null); renderJourney();
  },
  expand(keys) { keys.forEach((k) => { this.openSecs.add(k); Bus.emit("expand", k); }); if (this.current) Dossier.render(KG.get(this.current)); }
};

/* ---------------- DOSSIER ---------------- */
const Dossier = (function () {
  let el;
  const SECS = [
    ["what", "What is it?", "overview"], ["does", "What does it do?", "overview"], ["how", "How does it do it?", "intermediate"],
    ["connects", "What does it connect to?", "intermediate"], ["cells", "Which cells are involved?", "detailed"],
    ["molecular", "Which molecular mechanisms?", "detailed"], ["genes", "Which genes and proteins?", "detailed"],
    ["activated", "What happens when it is activated?", "molecular"], ["disrupted", "What happens when it is disrupted?", "molecular"],
    ["rel", "Relationships", "overview"]
  ];
  function build() {
    el = h("aside", { id: "dossier", class: "glass", hidden: true, "aria-label": "Details" });
    $("#app").append(el);
    el.addEventListener("click", (ev) => {
      const s = ev.target.closest(".sec > button");
      if (s) { const sec = s.parentElement, k = sec.dataset.k; sec.classList.toggle("open"); if (sec.classList.contains("open")) { App.openSecs.add(k); Bus.emit("expand", k); } else App.openSecs.delete(k); }
    });
  }
  function actions(e) {
    const A = [];
    const b = (label, fn, primary, icon) => { const x = h("button", { class: "btn" + (primary ? " primary" : ""), html: (icon ? ICON[icon] : "") + esc(label) }); x.onclick = fn; A.push(x); };
    if (e.type === "region") {
      if (e.mech) b("Play mechanism", () => { if (App.view !== "brain") { App.go("brain"); Brain.select(e.id); } Mech.open(e.id); }, true, "play");
      if (App.view !== "brain") b("Show in 3D brain", () => { App.go("brain"); Brain.select(e.id); }, false, "brain");
    }
    if (e.type === "gene") {
      b("Locate on chromosome " + e.chr, () => { App.go("cell"); Cell.showGene(e.id); }, true, "target");
      b("View DNA double helix", () => { App.go("cell"); Cell.showGene(e.id); Cell.setStage("helix"); }, false, "dna");
      const ck = Object.keys(KG.constructs).find((k) => KG.constructs[k].gene === e.id);
      if (ck) b("Simulate DNA → protein", () => { App.go("sim"); Sim.load(ck); }, false, "play");
    }
    if (["protein", "pathway", "transmitter", "cell", "function"].includes(e.type)) {
      const rs = KG.regionsFor(e.id);
      if (rs.length) b(`Where in the brain (${rs.length})`, () => { App.go("brain"); Brain.highlight(rs); }, true, "brain");
      if (e.loc) b("Where in the cell", () => { App.go("cell"); Cell.showLoc(e.loc); }, false, "cell");
    }
    if (e.type === "organelle" || (e.type === "concept" && e.stage !== "sim") || e.type === "chromosome") {
      if (App.view !== "cell") b("Show in cell explorer", () => { App.go("cell"); Cell.focusEntity(e.id); }, true, "cell");
      if (e.id === "o_nucleus") b("Zoom into the nucleus", () => { App.go("cell"); Cell.setStage("nucleus"); }, true, "target");
      if (e.id === "o_chromatin" || e.id === "k_chromosome" || e.id === "o_nucleus") b("See the chromosomes", () => { App.go("cell"); Cell.setStage("karyotype"); }, false, "target");
      if (e.id === "o_chromatin" || e.id === "k_chromosome") b("See nucleosomes", () => { App.go("cell"); Cell.setStage("fiber"); }, false, "target");
      if (e.id === "k_dna" || e.id === "k_gene") b("See the double helix", () => { App.go("cell"); Cell.setStage("helix"); }, false, "dna");
      if (e.id === "o_ribo" || e.id === "k_gene") b("Simulate DNA → protein", () => { App.go("sim"); Sim.load(); }, false, "play");
    }
    if (e.type === "concept" && e.stage === "sim") b("Run the DNA → protein simulation", () => { App.go("sim"); Sim.load(); }, true, "play");
    if (KG.tierOf(e.id) >= 0 && App.view !== "map") b("Show on map", () => { App.go("map"); MapView.setFocus(e.id); }, false, "map");
    if (e.type === "region" && e.drill) b("Study this", () => { Study.region = e.id; App.go("study"); Study.renderPath(); }, false, "study");
    return A;
  }
  function sec(k, title, html) {
    const open = App.openSecs.has(k) ? " open" : "";
    return `<div class="sec${open}" data-k="${k}"><button aria-expanded="${!!open}">${title}</button><div class="sbody">${html}</div></div>`;
  }
  function chainHTML(e) {
    const c = KG.chain(e.id, 3); if (!c) return "";
    const t0 = KG.tierOf(e.id);
    return `<div class="chain"><div class="eyebrow"><span>Causal chain</span><span style="color:var(--faint)">DNA → function</span></div><div class="chaincols">${c.map((col) => `<div class="ccol ${col.tier === t0 ? "here" : ""}"><span class="ct">${col.name}</span>${col.ids.length ? col.ids.map((x) => chipHTML(x, x === e.id ? "current" : "")).join("") : '<span class="none">—</span>'}${col.more ? `<span class="none">+${col.more} more</span>` : ""}</div>`).join("")}</div></div>`;
  }
  function drillHTML(e) {
    const d = e.drill; if (!d) return "";
    const done = State.drillDone[e.id] || {};
    const rows = [
      ["region", "Region", chipHTML(e.id)], ["circuit", "Circuit", `<span>${esc(d.circuit)}</span>`], ["cell", "Neuron", chipHTML(d.cell)],
      ["synapse", "Synapse", `<span>${esc(d.synapse)}</span>`], ["receptor", "Receptor", chipHTML(d.receptor)], ["pathway", "Signaling", chipHTML(d.pathway)],
      ["effector", "Protein", chipHTML(d.effector)], ["gene", "Gene", chipHTML(d.gene)],
      ["dna", "DNA", `<button class="chip" data-type="concept" data-dna="${d.gene}">Sequence & helix</button>`]
    ];
    return `<div class="drill"><div class="eyebrow">Drill down: structure → molecule</div><ol>${rows.map(([k, lv, html]) => `<li class="${done[k] || (k === "circuit" || k === "synapse") && done.cell ? "done" : ""}"><span class="lv">${lv}</span><span class="txt">${html}</span></li>`).join("")}</ol></div>`;
  }
  function relHTML(e) {
    const groups = {};
    KG.neighbors(e.id).forEach((n) => { (groups[n.label] = groups[n.label] || []).push(n.id); });
    const keys = Object.keys(groups);
    if (!keys.length) return '<p class="muted">No links yet.</p>';
    return keys.map((k) => `<div class="relgroup"><div class="rl">${esc(k)}</div><div class="chiprow">${[...new Set(groups[k])].map((x) => chipHTML(x)).join("")}</div></div>`).join("");
  }
  function genesHTML(e) {
    const ps = KG.proteinsFor(e.id).slice(0, 14);
    if (!ps.length) return '<p class="muted">None linked yet.</p>';
    return ps.map((p) => `<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 6px">${chipHTML(p)}<span style="color:var(--faint)">←</span>${(KG.get(p).genes || []).map((g) => chipHTML(g)).join("")}</div>`).join("");
  }
  function render(e) {
    el.hidden = false; el.classList.remove("minimized"); Panels.refresh();
    const label = KG.TYPE_LABEL[e.type] || e.type;
    const tcol = `var(--t-${e.type === "chromosome" ? "gene" : e.type})`;
    let body = "";
    if (e.type === "gene") {
      body += `<div class="chain" style="margin-top:12px"><div class="eyebrow"><span>Locus</span></div>
        <div class="seqline">chr${esc(e.chr)} · band ${esc(e.chr + e.band)} · ~${e.mb} Mb (GRCh38)</div>
        <div class="chiprow" style="margin-top:6px">${chipHTML("chr" + e.chr)}<span style="color:var(--faint)">→</span>${chipHTML(e.id, "current")}<span style="color:var(--faint)">→</span>${chipHTML(e.links[0][1])}</div>
        <a class="btn" style="text-decoration:none;margin-top:4px" href="https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(e.name)}%5Bsym%5D+AND+human%5Borgn%5D" target="_blank" rel="noopener">${ICON.ext} NCBI Gene record</a></div>`;
    }
    body += chainHTML(e);
    if (e.type === "region") body += drillHTML(e);
    const lv = (min) => levelAt(min);
    SECS.forEach(([k, title, min]) => {
      if (!lv(min)) return;
      if (k === "rel") { if (e.type !== "region") body += sec(k, title, relHTML(e)); return; }
      if (k === "genes") { if (e.type === "region") body += sec(k, title, genesHTML(e)); return; }
      if (k === "connects" && e.type === "region") { body += sec(k, title, `<p>${rich(e.connects)}</p><div class="chiprow">${KG.neighbors(e.id).filter((n) => n.rel === "projects").map((n) => chipHTML(n.id)).join("")}</div>`); return; }
      if (k === "cells" && e.type === "region") { body += sec(k, title, `<p>${rich(e.cells)}</p><div class="chiprow">${KG.neighbors(e.id).filter((n) => n.rel === "in_region").map((n) => chipHTML(n.id)).join("")}</div>`); return; }
      if (e[k]) body += sec(k, title, `<p>${rich(e[k])}</p>`);
    });
    if (e.type === "region") body += sec("rel", "All relationships", relHTML(e));
    el.innerHTML = `<div class="dhead"><div class="dtype"><span class="tdot" style="background:${tcol}"></span>${esc(label)}${e.kind ? " · " + esc(e.kind) : ""}${e.scale ? " · " + esc(e.scale) : ""}</div>
      <h2 class="${e.type === "gene" ? "gene" : ""}">${esc(e.name)}</h2><p class="short">${esc(e.short || "")}</p>
      <div class="pbtns"><button class="pmin" data-min="dossier" aria-label="Minimize details" title="Minimize">${ICON.min}</button><button class="dclose" aria-label="Close details" title="Close">${ICON.close}</button></div><div class="actions" id="dActs"></div></div><div class="dbody">${body}</div>`;
    actions(e).forEach((a) => $("#dActs").append(a));
    el.querySelector(".dclose").onclick = () => App.close();
    el.querySelectorAll("[data-dna]").forEach((b) => (b.onclick = () => { const g = b.dataset.dna; (State.drillDone[e.id] = State.drillDone[e.id] || {}).dna = true; App.open(g, { stay: true }); App.go("cell"); Cell.showGene(g); Cell.setStage("helix"); }));
    el.querySelector(".dbody").scrollTop = 0;
  }
  function hide() { el.hidden = true; el.classList.remove("minimized"); Panels.refresh(); }
  return { build, render, hide };
})();

/* ---------------- MINIMIZABLE PANELS ----------------
   Any panel with a [data-min] button can be tucked away; its tab appears in the
   top bar while the panel would otherwise be on screen. Click the tab to reopen. */
const Panels = (function () {
  const DEFS = {
    dossier: { label: () => (App.current ? KG.get(App.current).name : "Details"), kind: "Details", close: () => App.close() },
    player: { label: () => ($("#mTitle") ? $("#mTitle").textContent : "Animation"), kind: "Animation", close: () => Mech.close(), onMin: () => Mech.pause && Mech.pause() },
    ladder: { label: () => "Zoom & information flow", kind: "Panel" },
    seqStrip: { label: () => "DNA sequence", kind: "Panel" }
  };
  function min(id) { const el = $("#" + id); if (!el) return; el.classList.add("minimized"); DEFS[id].onMin && DEFS[id].onMin(); refresh(); }
  function restore(id) { const el = $("#" + id); if (!el) return; el.classList.remove("minimized"); refresh(); }
  function refresh() {
    const tray = $("#tray"); if (!tray) return;
    const items = Object.keys(DEFS).filter((id) => { const el = $("#" + id); return el && !el.hidden && el.classList.contains("minimized"); });
    tray.innerHTML = items.map((id) => `<span class="tpill glass"><button class="tp-open" data-restore="${id}" title="Reopen"><span class="tp-kind">${DEFS[id].kind}</span>${esc(DEFS[id].label())}</button>${DEFS[id].close ? `<button class="tp-x" data-tclose="${id}" aria-label="Close ${esc(DEFS[id].kind)}" title="Close">${ICON.close}</button>` : ""}</span>`).join("");
    const d = $("#dossier");
    document.documentElement.classList.toggle("dossier-open", !!d && !d.hidden && !d.classList.contains("minimized"));
    const p = $("#player");
    document.documentElement.classList.toggle("player-open", !!p && !p.hidden && !p.classList.contains("minimized"));
  }
  function init() {
    document.addEventListener("click", (e) => {
      const m = e.target.closest("[data-min]"); if (m) { min(m.dataset.min); return; }
      const r = e.target.closest("[data-restore]"); if (r) { restore(r.dataset.restore); return; }
      const x = e.target.closest("[data-tclose]"); if (x) { const id = x.dataset.tclose; $("#" + id).classList.remove("minimized"); DEFS[id].close(); refresh(); }
    });
    Object.keys(DEFS).forEach((id) => { const el = $("#" + id); if (el) new MutationObserver(refresh).observe(el, { attributes: true, attributeFilter: ["hidden"] }); });
    refresh();
  }
  return { init, refresh, min, restore };
})();
